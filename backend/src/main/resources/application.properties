# ========== Server Configuration ==========
server.port=8081
server.servlet.context-path=/api
server.compression.enabled=true

# ========== Database Configuration ==========
spring.datasource.url=jdbc:mysql://localhost:3306/science_forum
spring.datasource.username=forum_user
spring.datasource.password=forum_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ========== JPA/Hibernate Configuration ==========
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ========== Logging Configuration ==========
logging.level.root=INFO
logging.level.com.scienceforum=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== JWT Configuration ==========
jwt.secret=your-secret-key-here-change-in-production-very-long-key-for-security
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ========== Security Configuration ==========
spring.security.cors.allowed-origins=http://localhost:8080,http://localhost:3000
spring.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.security.cors.allowed-headers=*
spring.security.cors.allow-credentials=true

# ========== Application Configuration ==========
spring.application.name=science-forum-backend
app.version=1.0.0
app.name=Science Forum Platform

# ========== OpenAPI/Swagger Configuration ==========
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# ========== File Upload Configuration ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========== Jackson Configuration ==========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
